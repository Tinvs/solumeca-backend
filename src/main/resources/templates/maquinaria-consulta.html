<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Maquinaria | SOLUMECA S.A.S.</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .table-wrap {
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 21, 29, 0.95);
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .data-table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .data-table th {
      background: #1e293b !important;
      color: #f8fafc !important;
      font-family: var(--font-mono) !important;
      font-size: 11px !important;
      font-weight: 900 !important;
      text-transform: uppercase !important;
      letter-spacing: 1.1px !important;
      padding: 13px 14px !important;
      border-bottom: 2px solid var(--orange-1) !important;
      white-space: nowrap !important;
    }
    .data-table td {
      padding: 13px 14px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: #ffffff !important;
      vertical-align: middle !important;
      word-break: normal !important;
      overflow-wrap: break-word !important;
    }
    .data-table tbody tr:hover td {
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="dashboard-page">
  <main class="workspace-shell">
    <section class="workspace-panel workspace-panel--wide">
      <p class="plate-tag"><span class="plate-tag__bolt"></span>SOLUMECA S.A.S. // MAQUINARIA</p>
      
      <div class="workspace-heading" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
        <div>
          <h1 class="login-title">Consulta de Maquinaria</h1>
          <p class="login-subtitle">Visualización técnica de equipos pesados y montacargas.</p>
        </div>
        <div>
          <input type="text" id="filtroConsultaMaquinas" placeholder="Buscar por código, marca, serie..." class="table-search-input" style="padding:10px 14px; border:1px solid #334155; border-radius:var(--radius); font-size:14px; min-width:260px; background:#0f172a; color:#ffffff;">
        </div>
      </div>

      <div class="table-wrap" style="margin-top:20px;">
        <table class="data-table" id="tablaConsultaMaquinas">
          <thead>
            <tr>
              <th style="width: 100px;">Código</th>
              <th style="min-width: 220px;">Nombre</th>
              <th style="width: 140px;">Marca</th>
              <th style="width: 130px;">Modelo</th>
              <th style="width: 150px;">N° Serie</th>
              <th style="width: 140px; text-align:center;">Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="m : ${maquinas}">
              <td style="white-space:nowrap;"><strong style="font-family:var(--font-mono); color:var(--orange-1); font-size:13.5px;" th:text="${m.codigo != null ? m.codigo : 'MQ-' + m.id}">MQ-001</strong></td>
              <td><strong style="color:#ffffff; font-size:14px;" th:text="${m.nombre != null && #strings.length(m.nombre) > 20 ? #strings.substring(m.nombre, 0, 20) : m.nombre}">Nombre</strong></td>
              <td style="white-space:nowrap; font-weight:600; color:#e2e8f0;" th:text="${m.marca}">Marca</td>
              <td style="white-space:nowrap; color:#cbd5e1;" th:text="${m.modelo}">Modelo</td>
              <td style="white-space:nowrap;"><span style="font-family:var(--font-mono); font-size:13px; color:#cbd5e1;" th:text="${m.numeroSerie}">N/S</span></td>
              <td style="text-align:center; white-space:nowrap;">
                <span class="status-pill"
                      th:classappend="${m.estado == 'Operativa' ? 'status-pill--ok' : (m.estado == 'En mantenimiento' ? 'status-pill--warn' : 'status-pill--danger')}"
                      th:text="${m.estado}">Operativa</span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(maquinas)}">
              <td colspan="6" class="empty-state" style="text-align:center; padding:24px; color:var(--steel-light);">Aún no hay maquinaria registrada.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div style="margin-top:24px; display:flex; justify-content:space-between; align-items:center;">
        <a class="btn" href="/dashboard" style="background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#ffffff; padding:10px 20px; border-radius:var(--radius); font-size:14px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">Volver al Panel de Opciones</a>
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById('filtroConsultaMaquinas');
    if (input) {
      input.addEventListener('input', function() {
        const term = this.value.toLowerCase().trim();
        const rows = document.querySelectorAll('#tablaConsultaMaquinas tbody tr');
        rows.forEach(row => {
          const text = row.textContent.toLowerCase();
          row.style.display = text.includes(term) ? '' : 'none';
        });
      });
    }
  </script>
</body>
</html>
