<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${esNueva} ? 'Registrar maquinaria' : 'Modificar maquinaria'">Maquinaria</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <section class="login-section">
    <div class="login-card">
      <p class="plate-tag"><span class="plate-tag__bolt"></span>SOLUMECA S.A.S. // MAQUINARIA</p>
      <h1 class="login-title" th:text="${esNueva} ? 'Registrar maquinaria' : 'Modificar maquinaria'">Maquinaria</h1>
      <p class="login-subtitle">Complete los datos del equipo.</p>

      <form th:action="${esNueva} ? '/admin/maquinaria' : '/admin/maquinaria/' + ${maquina.id}"
            th:object="${maquina}" method="POST" class="login-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-row">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Retroexcavadora 01" required>
        </div>

        <div class="form-row">
          <label for="marca">Marca</label>
          <select id="marca" th:field="*{marca}" required
                  style="width:100%; padding:13px 14px; border-radius:var(--radius); border:1px solid var(--steel-line); background:var(--concrete); color:var(--ink); font-family:var(--font-body); font-size:14.5px;">
            <option value="">Seleccione una marca</option>
            <option value="YALE">YALE</option>
            <option value="TOYOTA">TOYOTA</option>
            <option value="RAYMOND">RAYMOND</option>
            <option value="BOBCAT">BOBCAT</option>
            <option value="NISSAN">NISSAN</option>
            <option value="CLARK">CLARK</option>
            <option value="KOMATSU">KOMATSU</option>
            <option value="LINDE">LINDE</option>
            <option value="KALMAR">KALMAR</option>
            <option value="GENIE">GENIE</option>
            <option value="DOOSAN">DOOSAN</option>
            <option value="Otra">Otra marca</option>
          </select>
          <input type="text" id="marcaPersonalizada" name="marcaPersonalizada"
                 placeholder="Escriba la marca" style="display:none; margin-top:10px;"
                 aria-label="Otra marca">
        </div>

        <div class="form-row">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" th:field="*{modelo}" placeholder="Ej: 420F2">
        </div>

        <div class="form-row">
          <label for="numeroSerie">Número de serie</label>
          <input type="text" id="numeroSerie" th:field="*{numeroSerie}" placeholder="Ej: CAT420F2-0091" required>
        </div>

        <div class="form-row">
          <label for="estado">Estado</label>
          <select id="estado" th:field="*{estado}" required
                  style="width:100%; padding:13px 14px; border-radius:var(--radius); border:1px solid var(--steel-line); background:var(--concrete); color:var(--ink); font-family:var(--font-body); font-size:14.5px;">
            <option value="">Seleccione un estado</option>
            <option value="Operativa">Operativa</option>
            <option value="En mantenimiento">En mantenimiento</option>
            <option value="Fuera de servicio">Fuera de servicio</option>
          </select>
        </div>

        <button type="submit" class="btn btn--primary login-btn" th:text="${esNueva} ? 'Registrar' : 'Guardar cambios'">Guardar</button>
      </form>

      <p class="login-footer"><a href="/admin/maquinaria">← Volver al listado</a></p>
      <p class="login-footer"><a href="/admin/dashboard">← Volver al panel</a></p>
    </div>
  </section>
  <script>
    const marca = document.getElementById('marca');
    const marcaPersonalizada = document.getElementById('marcaPersonalizada');
    const actualizarMarca = () => {
      const otra = marca.value === 'Otra';
      marcaPersonalizada.style.display = otra ? 'block' : 'none';
      marcaPersonalizada.required = otra;
      if (!otra) marcaPersonalizada.value = '';
    };
    marca.addEventListener('change', actualizarMarca);
    actualizarMarca();
  </script>
</body>
</html>
