<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Cliente | SOLUMECA S.A.S.</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="dashboard-page">
  <section class="login-section">
    <div class="login-card dashboard-card">
      <p class="plate-tag"><span class="plate-tag__bolt"></span>SOLUMECA S.A.S. // PANEL CLIENTE</p>
      <h1 class="login-title">Bienvenido, <span th:text="${username}">cliente</span></h1>
      <p class="login-subtitle">Solicite y consulte el mantenimiento de su maquinaria.</p>

      <ul class="dashboard-menu">
        <li><a href="/contacto.html"><span class="menu-icon">01</span><span class="menu-copy"><strong>Cotizar mantenimientos</strong><small>Solicita una cotización para tu equipo</small></span><span class="menu-arrow">&#8594;</span></a></li>
        <li><a href="/mantenimientos/cliente"><span class="menu-icon">02</span><span class="menu-copy"><strong>Ver estado del mantenimiento</strong><small>Consulta el avance de tu solicitud</small></span><span class="menu-arrow">&#8594;</span></a></li>
      </ul>

      <form th:action="@{/logout}" method="POST" class="dashboard-logout">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn--primary login-btn">Cerrar sesión</button>
      </form>
      <a href="/index.html" class="btn btn--primary login-btn">Volver a la página</a>
    </div>
  </section>
</body>
</html>
