<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${esNuevo} ? 'Registrar proveedor | SOLUMECA' : 'Modificar proveedor | SOLUMECA'">Proveedor</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="dashboard-page">
  <section class="login-section">
    <div class="login-card" style="max-width: 580px;">
      <p class="plate-tag"><span class="plate-tag__bolt"></span>SOLUMECA S.A.S. // PROVEEDORES</p>
      <h1 class="login-title" th:text="${esNuevo} ? 'Registrar Proveedor' : 'Modificar Proveedor'">Proveedor</h1>
      <p class="login-subtitle">Complete los datos de la empresa proveedora.</p>

      <form th:action="${esNuevo} ? '/admin/proveedores' : '/admin/proveedores/' + ${proveedor.id}"
            th:object="${proveedor}" method="POST" class="login-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-row">
          <label for="nombre">Razón Social / Nombre Comercial *</label>
          <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Distribuidora Diésel del Caribe S.A.S." required>
        </div>

        <div class="form-row">
          <label for="nit">NIT / Identificación Tributaria *</label>
          <input type="text" id="nit" th:field="*{nit}" placeholder="Ej: 900.123.456-1" required>
        </div>

        <div class="form-row">
          <label for="contacto">Persona de Contacto</label>
          <input type="text" id="contacto" th:field="*{contacto}" placeholder="Ej: Ing. Carlos Méndez">
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-row">
            <label for="telefono">Teléfono / WhatsApp</label>
            <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ej: +57 310 456 7890">
          </div>
          <div class="form-row">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Ej: ventas@proveedor.com">
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-row">
            <label for="ciudad">Ciudad</label>
            <input type="text" id="ciudad" th:field="*{ciudad}" placeholder="Ej: Barranquilla">
          </div>
          <div class="form-row">
            <label for="categoria">Categoría de Insumos</label>
            <input type="text" id="categoria" th:field="*{categoria}" placeholder="Ej: Repuestos, Lubricantes, Maquinaria">
          </div>
        </div>

        <div class="form-row">
          <label for="direccion">Dirección Física</label>
          <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ej: Calle 30 # 40-15">
        </div>

        <button type="submit" class="btn btn--primary login-btn" th:text="${esNuevo} ? 'Registrar proveedor' : 'Guardar cambios'">Guardar</button>
      </form>

      <p class="login-footer" style="margin-top:20px;"><a href="/admin/proveedores">← Volver al directorio de proveedores</a></p>
    </div>
  </section>
</body>
</html>
