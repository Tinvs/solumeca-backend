<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | SOLUMECA S.A.S.</title>
  <meta name="description" content="Crea tu cuenta de cliente o empresa en SOLUMECA S.A.S. para solicitar servicios y consultar tus mantenimientos.">
  <link rel="icon" type="image/png" href="assets/images/icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .tipo-cuenta-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tipo-cuenta-option {
      cursor: pointer;
      border: 1px solid var(--steel-line);
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius);
      padding: 10px 14px;
      text-align: center;
      transition: all 0.2s ease;
      user-select: none;
    }
    .tipo-cuenta-option input[type="radio"] {
      display: none;
    }
    .tipo-cuenta-option span {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .tipo-cuenta-option small {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .tipo-cuenta-option.is-active {
      background: rgba(255, 93, 28, 0.16);
      border-color: var(--orange-1);
    }
    .tipo-cuenta-option.is-active span {
      color: var(--orange-1);
    }
    .tipo-cuenta-option.is-active small {
      color: #f1f5f9;
    }
    .empresa-fields {
      display: none;
      padding-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      margin-top: 6px;
      margin-bottom: 6px;
    }
    .empresa-fields.is-visible {
      display: block;
    }
  </style>
</head>
<body>
  <header class="navbar is-scrolled" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__brand">
        <img src="assets/images/logo-transparent.png" alt="SOLUMECA S.A.S. - Soluciones Mecánicas" class="navbar__logo">
      </a>
      <nav class="navbar__nav" id="navMenu">
        <a href="index.html" class="navbar__link">Inicio</a>
        <a href="servicios.html" class="navbar__link">Servicios</a>
        <a href="contacto.html" class="navbar__link navbar__link--cta">Contáctenos</a>
        <a href="login.html" class="navbar__link">Iniciar sesión</a>
      </nav>
      <button class="navbar__toggle" id="navToggle" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="navMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="login-section">
      <div class="login-card">
        <p class="plate-tag"><span class="plate-tag__bolt"></span>SOLUMECA S.A.S. // NUEVA CUENTA</p>
        <h1 class="login-title">Crea tu cuenta</h1>
        <p class="login-subtitle">Regístrate como persona o empresa para solicitar servicios y dar seguimiento a tus mantenimientos.</p>

        <div class="login-error" id="registerError" role="alert" style="display:none;">
          <svg class="error-badge-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="registerErrorText"></span>
        </div>

        <form action="/registro" method="POST" class="login-form">
          <!-- SELECTOR DE TIPO DE CLIENTE: PERSONA NATURAL O EMPRESA -->
          <div class="tipo-cuenta-selector">
            <label class="tipo-cuenta-option is-active" id="optPersona" onclick="seleccionarTipo('PERSONA')">
              <input type="radio" name="tipoCliente" value="PERSONA" checked>
              <span>Persona Natural</span>
              <small>Propietario / Particular</small>
            </label>
            <label class="tipo-cuenta-option" id="optEmpresa" onclick="seleccionarTipo('EMPRESA')">
              <input type="radio" name="tipoCliente" value="EMPRESA">
              <span>Empresa / Jurídica</span>
              <small>Persona Jurídica</small>
            </label>
          </div>

          <!-- CAMPOS EXCLUSIVOS SI ES EMPRESA -->
          <div class="empresa-fields" id="bloqueEmpresa">
            <div class="form-row">
              <label for="nombreEmpresa" class="login-field-label">
                Nombre de la empresa <span style="font-size:11.5px; opacity:0.8; font-weight:normal; color:var(--orange-1);">(máx. 35 caracteres)</span>
              </label>
              <input type="text" id="nombreEmpresa" name="nombreEmpresa" placeholder="Ej: Inducol S.A.S. o Transportes del Norte" maxlength="35">
            </div>
            <div class="form-row">
              <label for="telefono" class="login-field-label">
                Número de teléfono / Celular <span style="font-size:11.5px; opacity:0.8; font-weight:normal; color:var(--orange-1);">(máx. 20 caracteres)</span>
              </label>
              <input type="tel" id="telefono" name="telefono" placeholder="Ej: 300 246 4311" maxlength="20">
            </div>
          </div>

          <!-- CAMPOS GENERALES DE ACCESO -->
          <div class="form-row">
            <label for="nombre" class="login-field-label" id="lblUsuario">
              Nombre de usuario <span style="font-size:11.5px; opacity:0.8; font-weight:normal; color:var(--orange-1);">(3 a 25 caracteres)</span>
            </label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre con el que iniciarás sesión" minlength="3" maxlength="25" autocomplete="username" required>
          </div>

          <div class="form-row">
            <label for="correo" class="login-field-label">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="correo@empresa.com" maxlength="50" autocomplete="email" required>
          </div>

          <div class="form-row">
            <label for="password" class="login-field-label">
              Contraseña <span style="font-size:11.5px; opacity:0.8; font-weight:normal; color:var(--orange-1);">(8 a 30 caracteres)</span>
            </label>
            <div class="password-input-wrapper">
              <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="30" autocomplete="new-password" required>
              <button type="button" class="btn-toggle-password" aria-label="Ver contraseña" title="Ver contraseña">
                <svg class="eye-show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn--primary login-btn">Crear cuenta <span aria-hidden="true">&#8594;</span></button>
        </form>

        <p class="login-footer">¿Ya tienes una cuenta? <a href="/login.html">Inicia sesión</a></p>
        <p class="login-footer login-footer--back">
          <a href="index.html">&#8592; Volver al sitio</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
  <script>
    function seleccionarTipo(tipo) {
      const optPersona = document.getElementById('optPersona');
      const optEmpresa = document.getElementById('optEmpresa');
      const bloqueEmpresa = document.getElementById('bloqueEmpresa');
      const lblUsuario = document.getElementById('lblUsuario');
      const inputEmpresa = document.getElementById('nombreEmpresa');

      if (tipo === 'EMPRESA') {
        optEmpresa.classList.add('is-active');
        optPersona.classList.remove('is-active');
        bloqueEmpresa.classList.add('is-visible');
        optEmpresa.querySelector('input').checked = true;
        lblUsuario.textContent = 'Usuario de acceso corporativo';
        if (inputEmpresa) inputEmpresa.setAttribute('required', 'true');
      } else {
        optPersona.classList.add('is-active');
        optEmpresa.classList.remove('is-active');
        bloqueEmpresa.classList.remove('is-visible');
        optPersona.querySelector('input').checked = true;
        lblUsuario.textContent = 'Nombre de usuario';
        if (inputEmpresa) inputEmpresa.removeAttribute('required');
      }
    }

    const messages = {
      nombre: 'El nombre debe tener entre 3 y 50 caracteres.',
      correo: 'Ingresa un correo electrónico válido.',
      password: 'La contraseña debe tener al menos 8 caracteres.',
      usuario: 'Ese nombre de usuario ya está registrado.',
      'correo-existente': 'Ese correo ya está registrado.'
    };
    const error = new URLSearchParams(window.location.search).get('error');
    const errorBox = document.getElementById('registerError');
    const errorText = document.getElementById('registerErrorText');
    if (error && messages[error] && errorBox && errorText) {
      errorText.textContent = messages[error];
      errorBox.style.display = 'flex';
      errorBox.classList.add('is-active');
    }
  </script>
</body>
</html>
